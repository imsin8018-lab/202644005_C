<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onmousemove</title>
    <script>
        let cursor;
        function makeCursor(){
            cursor = document.getElementById("cursor");
            cursor.style.zIndex = 100;
            var myMouse =document.getElementById("mouse");

            document.onmousemove = function (e){
                cursor.style.left = event.clientX + "px";
                cursor.style.top = event.clientY + "px";
                myMouse.innerHTML = cursor.style.left + ", " +cursor.style.top;
            }
        }
    </script>
</head>
<body onload="makeCursor()">
    <h3>이미지 커서 만들기</h3>
    <hr>
    <p id="p">마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다</p>
    <p id="mouse">마우스의 위치</p>
    <div id="cursor" style="position: absolute;">
        <img src="media/apple.png" width="30px" height="30px" alt="">
    </div>
    
</body>
</html>
